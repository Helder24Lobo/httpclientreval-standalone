plugins {
    id 'java'
    id 'application'
}

group = 'com.example.httpclientreval'
version = '1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.example.httpclientreval.Main'
}

// El menú de Main es interactivo (Scanner sobre System.in); sin esto,
// `./gradlew run` no conecta el teclado al proceso hijo.
tasks.named('run') {
    standardInput = System.in
}

test {
    useJUnitPlatform()
}
